<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600"
     fill="none" stroke="#222" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">

  <!-- ================= 电池 ================= -->
  <!-- 电池主体 -->
  <rect x="478" y="112" width="58" height="88" rx="8"/>
  <!-- 电池顶部橙色块（只描边） -->
  <rect x="486" y="120" width="42" height="26" rx="4"/>
  <!-- 电池底部格栅 -->
  <rect x="486" y="154" width="42" height="38" rx="4"/>
  <line x1="492" y1="164" x2="522" y2="164"/>
  <line x1="492" y1="173" x2="522" y2="173"/>
  <line x1="492" y1="182" x2="522" y2="182"/>

  <!-- ================= 主机与把手连接 ================= -->
  <!-- 主机外壳 -->
  <path d="M 470 128 L 402 158 L 396 200 L 440 208 L 488 172 Z"/>
  <!-- 把手杆 -->
  <path d="M 402 158 L 372 174"/>
  <!-- D 型把手 -->
  <path d="M 372 152 Q 340 136 320 158 L 320 200 Q 340 218 372 198"/>
  <!-- 把手防滑纹 -->
  <line x1="344" y1="150" x2="344" y2="208"/>
  <line x1="356" y1="148" x2="356" y2="210"/>
  <line x1="368" y1="150" x2="368" y2="208"/>

  <!-- ================= 伸缩杆 ================= -->
  <!-- 上段杆 -->
  <rect x="300" y="192" width="82" height="16" rx="6" transform="rotate(25 341 200)"/>
  <!-- 中段杆 -->
  <rect x="220" y="238" width="92" height="14" rx="5" transform="rotate(25 266 245)"/>
  <!-- 调节环 -->
  <rect x="246" y="232" width="18" height="24" rx="4" transform="rotate(25 255 244)"/>
  <!-- 下段杆 -->
  <rect x="150" y="278" width="86" height="16" rx="6" transform="rotate(25 193 286)"/>

  <!-- ================= 电机头 ================= -->
  <path d="M 160 308 L 128 330 L 118 392 L 160 412 L 202 380 L 202 330 Z"/>
  <!-- 散热片线条 -->
  <line x1="140" y1="336" x2="140" y2="386"/>
  <line x1="152" y1="330" x2="152" y2="392"/>
  <line x1="164" y1="328" x2="164" y2="394"/>
  <!-- 橙色标签 -->
  <rect x="176" y="350" width="20" height="12" rx="2"/>

  <!-- ================= 底部护罩 ================= -->
  <path d="M 100 420 Q 58 432 48 462 Q 68 482 120 482 L 222 482 Q 252 462 240 420 Q 200 408 160 414 Z"/>
  <!-- 护罩内层弧线 -->
  <path d="M 108 424 Q 78 436 72 456"/>

  <!-- ================= 打草头 ================= -->
  <!-- 转轴 -->
  <rect x="154" y="474" width="32" height="26" rx="4"/>
  <!-- 打草头圆盘 -->
  <ellipse cx="170" cy="510" rx="36" ry="12"/>
  <!-- 中心旋钮 -->
  <ellipse cx="170" cy="512" rx="13" ry="6"/>

  <!-- ================= 打草绳 ================= -->
  <path d="M 134 514 Q 100 528 58 540"/>
  <path d="M 206 514 Q 240 534 282 544"/>

</svg>